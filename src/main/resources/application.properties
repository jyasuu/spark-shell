spring.application.name=sparkctl
spring.shell.interactive.enabled=true

# Defaults — override via env vars: SPARK_HOST, SPARK_PORT, SPARK_DATABASE, SPARK_USERNAME, SPARK_PASSWORD
spark.host=${SPARK_HOST:localhost}
spark.port=${SPARK_PORT:9030}
spark.database=${SPARK_DATABASE:iceberg}
spark.username=${SPARK_USERNAME:}
spark.password=${SPARK_PASSWORD:}

