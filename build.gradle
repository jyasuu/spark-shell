plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.jyasu.sparkctl'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springShellVersion', "3.4.2")
}

configurations.all {
	// Force Spring Boot's Logback — exclude all competing logging impls
	exclude group: 'org.slf4j',         module: 'slf4j-log4j12'
	exclude group: 'org.slf4j',         module: 'slf4j-reload4j'
	exclude group: 'org.slf4j',         module: 'slf4j-simple'
	exclude group: 'ch.qos.reload4j',   module: 'reload4j'
	exclude group: 'log4j',             module: 'log4j'
	exclude group: 'commons-logging',   module: 'commons-logging'
	exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
}

dependencies {
	implementation 'org.springframework.shell:spring-shell-starter'

	// Hive JDBC driver (supports Spark Thrift Server)
	implementation('org.apache.hive:hive-jdbc:2.3.9') {
		exclude group: 'org.eclipse.jetty.aggregate', module: 'jetty-all'
		exclude group: 'org.eclipse.jetty',           module: '*'
	}
	implementation('org.apache.hadoop:hadoop-common:2.10.2') {
		exclude group: 'org.eclipse.jetty', module: '*'
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.shell:spring-shell-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.shell:spring-shell-dependencies:${springShellVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
